<!DOCTYPE html>
<html>
<head>
    <title>Simple Expense Tracker</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        input, select {
            padding: 10px;
            margin: 5px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .expense {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #4CAF50;
        }
    </style>
</head>
<body>
    <h1>💰 Simple Expense Tracker</h1>
    
    <h3>Add Expense</h3>
    <input id="desc" placeholder="What was it?">
    <input id="amount" type="number" placeholder="Amount ($)">
    <select id="paidBy">
        <option>You</option>
        <option>Friend</option>
        <option>Partner</option>
    </select>
    <button onclick="addExpense()">Add</button>
    
    <h3>Expenses</h3>
    <div id="expenses"></div>
    
    <h3>Who Owes What</h3>
    <div id="balance"></div>
    
    <script src="app.js"></script>
</body>
</html>
